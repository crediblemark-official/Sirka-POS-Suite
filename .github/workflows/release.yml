name: "Release Sirka (Linux, macOS, Windows)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Buat sebagai Draft Release? (false = langsung dipublikasikan)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 2. Setup Rust toolchain
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 2.1 Install cargo-tauri CLI binary
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # 3. Cache Rust dependencies
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 4. Install Linux system libraries (WebKit2GTK 4.1 for Tauri v2, AppIndicator, RSVG, FUSE)
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libssl-dev \
            libfuse2

      # 5. Install frontend dependencies
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # 5.1 Import Windows Code Signing Certificate (on windows-latest)
      - name: Import Windows Code Signing Certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $pfxPath = "${{ github.workspace }}/certs/Sirka_CodeSigning.pfx"
          $certPass = "Sirka2026!"
          if (Test-Path $pfxPath) {
            Write-Host "Importing Sirka Code Signing Certificate..."
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $certPass -AsPlainText -Force)
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\LocalMachine\Root -Password (ConvertTo-SecureString -String $certPass -AsPlainText -Force)
            Write-Host "Certificate imported successfully."
          }

      # 6. Build Tauri application & publish to GitHub Releases
      - name: Build and Upload Release Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_TERTAUT_APP_ID: ${{ secrets.VITE_TERTAUT_APP_ID }}
          VITE_TERTAUT_PUBLISHABLE_KEY: ${{ secrets.VITE_TERTAUT_PUBLISHABLE_KEY }}
          VITE_TERTAUT_API_KEY: ${{ secrets.VITE_TERTAUT_PUBLISHABLE_KEY }}
          VITE_TERTAUT_BASE_URL: ${{ secrets.VITE_TERTAUT_BASE_URL || 'https://tertaut.com' }}
        with:
          tagName: v__VERSION__
          releaseName: 'Sirka v__VERSION__'
          releaseBody: |
            ### 📦 Sirka v__VERSION__

            Build otomatis multi-platform menggunakan GitHub Actions untuk:
            - 🪟 **Windows**: Installer `.msi` dan `.exe` (NSIS)
            - 🍎 **macOS**: `.dmg` (Apple Silicon `aarch64` & Intel `x86_64`)
            - 🐧 **Linux**: `.deb` dan `.AppImage`
            - 📱 **Android**: `.apk` (Sirka Owner Mobile)

            Silakan unduh file instalasi di bawah sesuai dengan sistem operasi perangkat Anda.
          releaseDraft: ${{ github.event.inputs.release_draft || false }}
          prerelease: false
          args: ${{ matrix.args }}
