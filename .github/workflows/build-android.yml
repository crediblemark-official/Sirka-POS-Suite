name: "Build Android APKs (Sirka POS & Owner Mobile)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build & Sign APK (${{ matrix.app.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - id: pos
            name: "Sirka POS Mobile"
            dir: "apps/sirka-mobile"
            artifact: "sirka-pos-mobile-apk"
            output_name: "Sirka_POS"
          - id: owner
            name: "Sirka Owner Mobile"
            dir: "apps/sirka-owner-mobile"
            artifact: "sirka-owner-mobile-apk"
            output_name: "Sirka_Owner"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # 1. Install monorepo dependencies (packages/* & apps/*)
      - name: Install Monorepo Dependencies
        run: bun install --frozen-lockfile

      # 2. Inisialisasi Android Tauri Project & Pasang Aset Resmi
      - name: Inisialisasi Android Tauri Project & Pasang Aset Resmi
        working-directory: ${{ matrix.app.dir }}
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            bun run tauri android init --ci
          fi
          # Salin ikon resmi Sirka ke folder Android res bila ada
          if [ -d "src-tauri/icons/android" ]; then
            echo "Menyalin ikon resmi Sirka ke Android res..."
            mkdir -p src-tauri/gen/android/app/src/main/res/
            cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true
          fi
          # Pasang plugin Android Keystore untuk keamanan biometrik
          node scripts/install-android-keystore.mjs || true

      # 3. Build APK Release (ARM64)
      - name: Build APK Release
        working-directory: ${{ matrix.app.dir }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_TERTAUT_APP_ID: ${{ secrets.VITE_TERTAUT_APP_ID }}
          VITE_TERTAUT_PUBLISHABLE_KEY: ${{ secrets.VITE_TERTAUT_PUBLISHABLE_KEY }}
          VITE_TERTAUT_API_KEY: ${{ secrets.VITE_TERTAUT_PUBLISHABLE_KEY }}
          VITE_TERTAUT_BASE_URL: ${{ secrets.VITE_TERTAUT_BASE_URL || 'https://tertaut.com' }}
        run: bun run tauri android build --apk --target aarch64

      # 4. Sign APK with Release Keystore (zipalign & apksigner v1, v2, v3)
      - name: Sign APK with Release Keystore
        working-directory: ${{ matrix.app.dir }}
        run: node scripts/sign-apk.mjs

      # 5. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.dir }}/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # 6. Upload APK to GitHub Release jika tag v*
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE=$(find ${{ matrix.app.dir }}/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            CLEAN_NAME="${{ matrix.app.output_name }}_${TAG_NAME#v}.apk"
            cp "$APK_FILE" "$CLEAN_NAME"
            echo "Memastikan GitHub Release $TAG_NAME tersedia..."
            gh release view "$TAG_NAME" || gh release create "$TAG_NAME" --title "Sirka $TAG_NAME" --notes "Rilis Sirka $TAG_NAME" || true
            gh release upload "$TAG_NAME" "$CLEAN_NAME" --clobber
          fi
