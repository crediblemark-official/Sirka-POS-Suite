name: "Build Android APK (Sirka Owner Mobile)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        working-directory: mobile
        run: bun install

      - name: Inisialisasi Android Tauri Project (if not generated)
        working-directory: mobile
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            bun run tauri android init --ci
          fi

      - name: Build APK Release
        working-directory: mobile
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
        run: bun run tauri android build --apk --target aarch64

      - name: Sign APK with Release Keystore
        working-directory: mobile
        run: |
          APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Signing $APK_FILE with sirka-release.keystore..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../certs/sirka-release.keystore -storepass Sirka2026! -keypass Sirka2026! "$APK_FILE" sirka
            echo "APK signed successfully."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sirka-owner-mobile-apk
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            CLEAN_NAME="Sirka_Owner_${TAG_NAME#v}.apk"
            cp "$APK_FILE" "$CLEAN_NAME"
            gh release upload "$TAG_NAME" "$CLEAN_NAME" --clobber
          fi
