name: "Build Android APK (Sirka Owner Mobile)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        working-directory: mobile
        run: bun install

      - name: Inisialisasi Android Tauri Project (if not generated)
        working-directory: mobile
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            bun run tauri android init --ci
            node scripts/install-android-keystore.mjs
          fi

      - name: Build APK Release
        working-directory: mobile
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
        run: bun run tauri android build --apk --target aarch64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirka-owner-mobile-apk
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
