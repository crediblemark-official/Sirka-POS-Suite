services:
  db:
    image: postgres:16-alpine
    container_name: sirka_pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirka_pos_user
      POSTGRES_PASSWORD: sirka_pos_password
      POSTGRES_DB: sirka_pos_db
    ports:
      - "5434:5432"
    volumes:
      - sirka_pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirka_pos_user -d sirka_pos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sirka_pos_pgdata:
