[package]
name = "sirka-mobile-app"
version = "0.2.4"
description = "Sirka POS Suite Mobile"
authors = ["you"]
edition = "2024"

[lib]
name = "sirka_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
tokio = { version = "1.53.3", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
rfd = "0.17.2"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
